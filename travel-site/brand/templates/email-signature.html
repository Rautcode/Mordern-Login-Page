<!doctype html><meta charset="utf-8"><title>Email signature</title>
<!-- Copy everything inside the box into your email app's signature settings. Text only: email apps do not show SVG logos reliably, and linked images get blocked. -->
<body style="margin:24px;font-family:Arial,sans-serif">
<table cellpadding="0" cellspacing="0" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#1F2421;border-left:4px solid #E8541E;padding-left:12px">
<tr><td style="font-size:16px;font-weight:bold;color:#1B3B2B">{{founder}}</td></tr>
<tr><td style="color:#E8541E;font-size:12px;letter-spacing:1px;text-transform:uppercase">{{title}}, <span style="color:#1B3B2B">Ghumo</span>Co</td></tr>
<tr><td style="padding-top:6px">{{phone}} &nbsp;|&nbsp; <a href="mailto:{{email}}" style="color:#1B3B2B">{{email}}</a></td></tr>
<tr><td><a href="https://{{website}}" style="color:#1B3B2B">{{website}}</a> &nbsp;|&nbsp; {{instagram}}</td></tr>
<tr><td style="padding-top:6px;color:#5E5A50;font-size:12px">{{tagline}}</td></tr></table>
