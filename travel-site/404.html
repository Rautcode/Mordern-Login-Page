<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | [BRAND_NAME]</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#F5EEE1;--ink:#1F2421;--forest:#1B3B2B;--terra:#A8431F}
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}

  h1{font:400 clamp(2.2rem,8vw,3.4rem)/1.1 Georgia,serif;color:var(--forest);margin-bottom:14px}
  p{margin-bottom:26px;color:#5E5A50}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:700;text-decoration:none;min-height:48px}
  .a{background:var(--terra);color:#fff}.b{border:2px solid var(--forest);color:var(--forest)}
  a:focus-visible{outline:3px solid #D4A359;outline-offset:3px}

</head>

<main>
  <h1>This turn isn't on the map.</h1>

  <div class="row"><a class="a" href="/">Back to the home page</a><a class="b" href="https://wa.me/91XXXXXXXXXX">Chat on WhatsApp</a></div>
